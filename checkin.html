<title>เช็คชื่อรับชุด (แอดมิน) — TU Basketball Alumni</title>
<style>
  :root{
    --maroon:#8A1F2B; --maroon-deep:#5E121B; --gold:#B8892F;
    --paper:#E9DFC5; --card:#F1E9D6; --input-bg:#FFFFFF; --ink:#241512; --muted:#7A6A5E;
    --line:rgba(36,21,18,0.18); --success:#2F7D4F; --danger:#B8471F; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --maroon:#E2596B; --maroon-deep:#F0A0AC; --gold:#E4B856;
      --paper:#1B1512; --card:#241C17; --input-bg:#4A3B2C; --ink:#F1E9DC; --muted:#B8A996;
      --line:rgba(241,233,220,0.16); --success:#5FBE86; --danger:#E2725A;
    }
  }
  :root[data-theme="dark"]{
    --maroon:#E2596B; --maroon-deep:#F0A0AC; --gold:#E4B856;
    --paper:#1B1512; --card:#241C17; --input-bg:#4A3B2C; --ink:#F1E9DC; --muted:#B8A996;
    --line:rgba(241,233,220,0.16); --success:#5FBE86; --danger:#E2725A;
  }
  :root[data-theme="light"]{
    --maroon:#8A1F2B; --maroon-deep:#5E121B; --gold:#B8892F;
    --paper:#E9DFC5; --card:#F1E9D6; --input-bg:#FFFFFF; --ink:#241512; --muted:#7A6A5E;
    --line:rgba(36,21,18,0.18); --success:#2F7D4F; --danger:#B8471F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,-apple-system,'Segoe UI',sans-serif;
    font-size:16px; line-height:1.55; padding:16px 14px 90px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:1.15rem; margin:0 0 2px;}
  .sub{color:var(--muted); font-size:.82rem; margin:0 0 16px;}
  .search-row{display:flex; gap:8px; margin-bottom:8px;}
  .search-row input[type="text"]{flex:1;}
  input[type="text"], select{
    padding:11px 12px; font-size:.95rem; font-family:inherit;
    background:var(--input-bg); color:var(--ink); border:1.5px solid var(--line); border-radius:9px;
  }
  select{width:100%; margin-bottom:8px;}
  .btn{padding:11px 16px; font-size:.92rem; font-weight:700; font-family:inherit; color:#fff; background:var(--maroon); border:none; border-radius:9px; cursor:pointer;}
  .btn:disabled{background:var(--line); color:var(--muted); cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--maroon); border:1.5px solid var(--line);}

  .row{display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
  .row.disabled{opacity:.55;}
  .row input[type="checkbox"]{width:20px; height:20px; margin-top:2px; accent-color:var(--maroon); flex:none;}
  .row .info{flex:1; min-width:0;}
  .row .name{font-weight:700; font-size:.94rem;}
  .row .meta{font-size:.78rem; color:var(--muted); margin-top:1px;}
  .row .items{font-size:.82rem; margin-top:4px;}
  .row .status{display:inline-block; margin-top:5px; font-size:.74rem; font-weight:700; padding:3px 8px; border-radius:99px; background:var(--maroon); color:#fff;}
  .row .status.received{background:var(--success);}
  .row .status.other{background:var(--muted);}
  .row .reason{font-size:.74rem; color:var(--danger); margin-top:3px;}

  .bar{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .bar .count{font-size:.86rem; color:var(--muted);}
  .msg{font-size:.84rem; font-weight:600; margin:10px 0; padding:10px 12px; border-radius:9px;}
  .msg.err{background:rgba(184,71,31,.12); color:var(--danger);}
  .msg.ok{background:rgba(47,125,79,.12); color:var(--success);}
  .empty{color:var(--muted); font-size:.88rem; text-align:center; padding:20px 0;}
  .gate{max-width:420px; margin:60px auto; text-align:center; color:var(--danger); font-weight:600;}
</style>

<div class="wrap" id="app">
  <h1>เช็คชื่อรับชุด</h1>
  <p class="sub">สำหรับทีมแอดมินเท่านั้น — ค้นหาแล้วติ๊กเลือกได้หลายรายการ ก่อนกดยืนยัน</p>

  <div class="search-row">
    <input type="text" id="q" placeholder="ค้นชื่อหรือเบอร์โทร">
    <button class="btn" id="btn-search">ค้นหา</button>
  </div>
  <select id="category">
    <option value="">-- ทุกรุ่น --</option>
    <option>ชาย 27+</option>
    <option>ชาย 40+</option>
    <option>ชาย 50+</option>
    <option>ชาย 57+</option>
    <option>หญิง 27+</option>
    <option>หญิง 35+</option>
    <option>หญิง 45+</option>
    <option>กองเชียร์หรืออื่นๆ</option>
  </select>

  <p class="msg" id="msg" style="display:none;"></p>
  <div id="results"></div>
</div>

<div class="bar" id="bar" style="display:none;">
  <span class="count" id="count">เลือกไว้ 0 รายการ</span>
  <button class="btn" id="btn-confirm">ยืนยันว่ามารับแล้ว</button>
</div>

<script>
(function(){
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwVUZUUNgz3xuwcdCQiCekAdiERjYh55q3bBAoukHKwnIsO4-FfPmtzanRi6uNM-8G/exec';
  var SHIP_LABEL_PICKUP = 'รับเองที่โรงยิมท่าพระจันทร์';

  var token = new URLSearchParams(location.search).get('token');
  if(!token){
    document.getElementById('app').innerHTML = '<div class="gate">ลิงก์นี้ไม่มีรหัสเข้าถึง — ต้องเปิดผ่านลิงก์ที่มี ?token=... ต่อท้ายเท่านั้น</div>';
  } else {
    initApp();
  }

  function initApp(){
    function $(s){ return document.querySelector(s); }
    var selected = {}; // row number -> true

    function showMsg(text, type){
      var m = $('#msg');
      if(!text){ m.style.display='none'; return; }
      m.textContent = text;
      m.className = 'msg ' + (type||'err');
      m.style.display = 'block';
    }

    function itemLines(r){
      var lines = [];
      if(r.tank.on) lines.push('เสื้อกล้าม '+(r.tank.size||'-'));
      if(r.short.on) lines.push('เสื้อแขนสั้น '+(r.short.size||'-'));
      if(r.shorts.on) lines.push('กางเกง '+(r.shorts.size||'-'));
      return lines.join(' • ');
    }

    function updateBar(){
      var n = Object.keys(selected).length;
      $('#bar').style.display = n > 0 ? 'flex' : 'none';
      $('#count').textContent = 'เลือกไว้ ' + n + ' รายการ';
    }

    function renderResults(results){
      selected = {};
      updateBar();
      var el = $('#results');
      if(!results.length){
        el.innerHTML = '<p class="empty">ไม่พบรายการที่ตรงกับที่ค้นหา</p>';
        return;
      }
      el.innerHTML = results.map(function(r){
        var canCheck = r.shipMethod === SHIP_LABEL_PICKUP && r.status !== 'รับชุดแล้ว';
        var statusClass = r.status === 'รับชุดแล้ว' ? 'received' : (r.shipMethod !== SHIP_LABEL_PICKUP ? 'other' : '');
        var who = r.label ? (r.name + ' (' + r.label + ')') : r.name;
        var reason = '';
        if(r.status === 'รับชุดแล้ว') reason = 'รับชุดไปแล้ว';
        else if(r.shipMethod !== SHIP_LABEL_PICKUP) reason = 'จัดส่งที่บ้าน — เช็คอินรับของที่นี่ไม่ได้';
        return '<div class="row' + (canCheck ? '' : ' disabled') + '" data-row="' + r.row + '">' +
          '<input type="checkbox" ' + (canCheck ? '' : 'disabled') + ' data-row="' + r.row + '">' +
          '<div class="info">' +
            '<div class="name">' + esc(who) + '</div>' +
            '<div class="meta">' + esc(r.phone) + (r.category ? ' • ' + esc(r.category) : '') + '</div>' +
            '<div class="items">' + esc(itemLines(r) || '—') + '</div>' +
            '<span class="status ' + statusClass + '">' + esc(r.status || 'รอสรุปยอดสั่งซื้อ') + '</span>' +
            (reason ? '<div class="reason">' + esc(reason) + '</div>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

    var lastResults = [];

    function doSearch(){
      showMsg('');
      var q = $('#q').value.trim();
      var category = $('#category').value;
      var url = APPS_SCRIPT_URL + '?mode=admin&token=' + encodeURIComponent(token) +
        '&q=' + encodeURIComponent(q) + '&category=' + encodeURIComponent(category);
      $('#btn-search').disabled = true;
      fetch(url).then(function(res){ return res.json(); }).then(function(data){
        $('#btn-search').disabled = false;
        if(!data.ok){ showMsg(data.error || 'ค้นหาไม่สำเร็จ'); $('#results').innerHTML=''; return; }
        lastResults = data.results;
        renderResults(lastResults);
      }).catch(function(err){
        $('#btn-search').disabled = false;
        showMsg('ค้นหาไม่สำเร็จ: ' + err.message);
      });
    }

    $('#btn-search').addEventListener('click', doSearch);
    $('#q').addEventListener('keydown', function(ev){ if(ev.key==='Enter') doSearch(); });
    $('#category').addEventListener('change', doSearch);

    $('#results').addEventListener('change', function(ev){
      var t = ev.target;
      if(t.type !== 'checkbox') return;
      var row = t.dataset.row;
      if(t.checked){ selected[row] = true; } else { delete selected[row]; }
      updateBar();
    });

    $('#btn-confirm').addEventListener('click', function(){
      var rows = Object.keys(selected);
      if(!rows.length) return;
      var btn = $('#btn-confirm');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({ action: 'markReceived', token: token, rows: rows })
      }).then(function(res){ return res.json(); }).then(function(data){
        btn.disabled = false; btn.textContent = 'ยืนยันว่ามารับแล้ว';
        if(!data.ok){ showMsg(data.error || 'บันทึกไม่สำเร็จ'); return; }
        showMsg('บันทึกสำเร็จ ' + data.updated.length + ' รายการ', 'ok');
        doSearch(); // รีเฟรชผลลัพธ์ให้เห็นสถานะล่าสุด
      }).catch(function(err){
        btn.disabled = false; btn.textContent = 'ยืนยันว่ามารับแล้ว';
        showMsg('บันทึกไม่สำเร็จ: ' + err.message);
      });
    });
  }
})();
</script>

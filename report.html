<title>รายงานยอดขาย — TU Basketball Alumni</title>
<style>
  :root{
    --maroon:#8A1F2B; --maroon-deep:#5E121B; --gold:#B8892F;
    --paper:#E9DFC5; --card:#F1E9D6; --input-bg:#FFFFFF; --ink:#241512; --muted:#7A6A5E;
    --line:rgba(36,21,18,0.18); --success:#2F7D4F; --danger:#B8471F; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --maroon:#E2596B; --maroon-deep:#F0A0AC; --gold:#E4B856;
      --paper:#1B1512; --card:#241C17; --input-bg:#4A3B2C; --ink:#F1E9DC; --muted:#B8A996;
      --line:rgba(241,233,220,0.16); --success:#5FBE86; --danger:#E2725A;
    }
  }
  :root[data-theme="dark"]{
    --maroon:#E2596B; --maroon-deep:#F0A0AC; --gold:#E4B856;
    --paper:#1B1512; --card:#241C17; --input-bg:#4A3B2C; --ink:#F1E9DC; --muted:#B8A996;
    --line:rgba(241,233,220,0.16); --success:#5FBE86; --danger:#E2725A;
  }
  :root[data-theme="light"]{
    --maroon:#8A1F2B; --maroon-deep:#5E121B; --gold:#B8892F;
    --paper:#E9DFC5; --card:#F1E9D6; --input-bg:#FFFFFF; --ink:#241512; --muted:#7A6A5E;
    --line:rgba(36,21,18,0.18); --success:#2F7D4F; --danger:#B8471F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,-apple-system,'Segoe UI',sans-serif;
    font-size:16px; line-height:1.55; padding:16px 14px 40px;
  }
  .wrap{max-width:680px; margin:0 auto;}
  h1{font-size:1.15rem; margin:0 0 2px;}
  .sub{color:var(--muted); font-size:.82rem; margin:0 0 16px;}
  .gate{max-width:420px; margin:60px auto; text-align:center; color:var(--danger); font-weight:600;}

  .grand{
    background:linear-gradient(160deg,var(--maroon),var(--maroon-deep)); color:#fff;
    border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;
  }
  .grand .label{font-size:.82rem; opacity:.85; margin-bottom:4px;}
  .grand .amount{font-size:1.7rem; font-weight:700;}
  .grand .sub2{font-size:.8rem; opacity:.85; margin-top:2px;}

  select, input[type="text"]{
    padding:11px 12px; font-size:.95rem; font-family:inherit;
    background:var(--input-bg); color:var(--ink); border:1.5px solid var(--line); border-radius:9px;
    width:100%;
  }
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.86rem; font-weight:600; margin-bottom:6px;}

  .daycard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .daycard .d-date{font-weight:700; font-size:1rem;}
  .daycard .d-meta{color:var(--muted); font-size:.82rem;}
  .daycard .d-total{font-size:1.15rem; font-weight:700; color:var(--maroon-deep);}

  table{width:100%; border-collapse:collapse; font-size:.86rem;}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
  th{color:var(--muted); font-weight:700; font-size:.78rem;}
  td.num, th.num{text-align:right;}
  .tablewrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:4px 12px;}
  tr.foot td{border-top:2px solid var(--line); border-bottom:none; font-weight:700;}
  .empty{color:var(--muted); font-size:.88rem; text-align:center; padding:20px 0;}
  .msg{font-size:.84rem; font-weight:600; margin:10px 0; padding:10px 12px; border-radius:9px; background:rgba(184,71,31,.12); color:var(--danger);}
  .msg.ok{background:rgba(47,125,79,.12); color:var(--success);}
  h2{font-size:1rem; margin:22px 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .btn-copy{padding:7px 12px; font-size:.78rem; font-weight:700; font-family:inherit; color:var(--maroon); background:transparent; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; white-space:nowrap;}
</style>

<div class="wrap" id="app">
  <h1>รายงานยอดขาย</h1>
  <p class="sub">สำหรับทีมแอดมินเท่านั้น — เลือกวันที่เพื่อดูยอดขายเฉพาะวันนั้น</p>

  <div class="grand" id="grand">กำลังโหลด...</div>

  <div class="field">
    <label for="daySelect">เลือกวันที่</label>
    <select id="daySelect">
      <option value="">-- ทุกวัน (ดูสรุปรายวันทั้งหมด) --</option>
    </select>
  </div>

  <p class="msg" id="msg" style="display:none;"></p>

  <div id="dayDetail"></div>
</div>

<script>
(function(){
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwVUZUUNgz3xuwcdCQiCekAdiERjYh55q3bBAoukHKwnIsO4-FfPmtzanRi6uNM-8G/exec';

  var token = new URLSearchParams(location.search).get('token');
  if(!token){
    document.getElementById('app').innerHTML = '<div class="gate">ลิงก์นี้ไม่มีรหัสเข้าถึง — ต้องเปิดผ่านลิงก์ที่มี ?token=... ต่อท้ายเท่านั้น</div>';
  } else {
    initApp();
  }

  function initApp(){
    function $(s){ return document.querySelector(s); }
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function money(n){ return Number(n||0).toLocaleString('th-TH'); }

    function thDate(dstr){
      if(!dstr || dstr === 'ไม่ทราบวันที่') return dstr;
      var parts = dstr.split('-');
      var months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
      var y = Number(parts[0]) + 543;
      var m = months[Number(parts[1]) - 1];
      var d = Number(parts[2]);
      return d + ' ' + m + ' ' + y;
    }

    function thShortDate(dstr){
      if(!dstr || dstr === 'ไม่ทราบวันที่') return dstr;
      var parts = dstr.split('-');
      var yy = (Number(parts[0]) + 543) % 100;
      return parts[2] + '/' + parts[1] + '/' + (yy < 10 ? '0' + yy : yy);
    }

    function ordersForDay(dateStr){
      return report.orders.filter(function(o){ return o.date === dateStr; })
        .sort(function(a,b){ return a.time < b.time ? -1 : (a.time > b.time ? 1 : 0); });
    }

    function showMsg(text){
      var m = $('#msg');
      if(!text){ m.style.display='none'; return; }
      m.textContent = text;
      m.style.display = 'block';
    }

    var report = null;

    function renderGrand(){
      $('#grand').innerHTML =
        '<div class="label">ยอดรวมทั้งหมด (ทุกวัน)</div>' +
        '<div class="amount">' + money(report.grandTotal) + ' บาท</div>' +
        '<div class="sub2">' + report.grandOrderCount + ' ออเดอร์</div>';
    }

    function renderDaySelect(){
      var sel = $('#daySelect');
      report.days.forEach(function(d){
        var opt = document.createElement('option');
        opt.value = d.date;
        opt.textContent = thDate(d.date) + ' — ' + d.orderCount + ' ออเดอร์ • ' + money(d.total) + ' บาท';
        sel.appendChild(opt);
      });
    }

    function renderAllDaysTable(){
      if(!report.days.length){
        $('#dayDetail').innerHTML = '<p class="empty">ยังไม่มีออเดอร์เข้ามา</p>';
        return;
      }
      var rows = report.days.map(function(d){
        return '<tr><td>' + esc(thDate(d.date)) + '</td>' +
          '<td class="num">' + d.orderCount + '</td>' +
          '<td class="num">' + d.pieces + '</td>' +
          '<td class="num">' + money(d.total) + '</td></tr>';
      }).join('');
      $('#dayDetail').innerHTML =
        '<h2>สรุปยอดรายวัน</h2>' +
        '<div class="tablewrap"><table>' +
        '<tr><th>วันที่</th><th class="num">ออเดอร์</th><th class="num">ชิ้น</th><th class="num">ยอดขาย (บาท)</th></tr>' +
        rows + '</table></div>';
    }

    function renderOneDay(dateStr){
      var day = report.days.find(function(d){ return d.date === dateStr; });
      var orders = ordersForDay(dateStr);
      var summary = '<div class="daycard">' +
        '<div><div class="d-date">' + esc(thDate(dateStr)) + '</div>' +
        '<div class="d-meta">' + (day ? day.orderCount : 0) + ' ออเดอร์ • ' + (day ? day.pieces : 0) + ' ชิ้น</div></div>' +
        '<div class="d-total">' + money(day ? day.total : 0) + ' บาท</div></div>';

      var rows = orders.map(function(o){
        var who = o.label ? (o.name + ' (' + o.label + ')') : o.name;
        return '<tr><td>' + esc(o.time) + '</td><td>' + esc(who) + '</td>' +
          '<td>' + esc(o.shipMethod) + '</td>' +
          '<td class="num">' + o.pieces + '</td>' +
          '<td class="num">' + money(o.amount) + '</td></tr>';
      }).join('');

      var foot = orders.length
        ? '<tr class="foot"><td colspan="4">รวม ' + orders.length + ' รายการ</td><td class="num">' + money(day ? day.total : 0) + ' บาท</td></tr>'
        : '';

      $('#dayDetail').innerHTML = summary +
        '<h2>รายการออเดอร์วันนี้ (สำหรับกระทบยอดกับบัญชีธนาคาร)' +
        '<button class="btn-copy" id="btn-copy-day">คัดลอกสรุปยอด</button></h2>' +
        '<div class="tablewrap"><table>' +
        '<tr><th>เวลา</th><th>ผู้สั่งซื้อ</th><th>วิธีจัดส่ง</th><th class="num">ชิ้น</th><th class="num">ยอดโอน (บาท)</th></tr>' +
        (rows || '<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>') + foot + '</table></div>' +
        '<p class="msg ok" id="copy-msg" style="display:none;"></p>';

      var copyBtn = $('#btn-copy-day');
      if(copyBtn){
        copyBtn.addEventListener('click', function(){ copyDayText(dateStr, orders, day); });
      }
    }

    function copyDayText(dateStr, orders, day){
      var lines = orders.map(function(o){
        return o.time + ' คุณ' + o.name + '   ' + money(o.amount) + '.-';
      });
      var text = 'วันที่ ' + thShortDate(dateStr) + '\n\n' +
        lines.join('\n') +
        '\n\nรวม ' + orders.length + ' รายการ เป็นเงิน ' + money(day ? day.total : 0) + '.-';
      navigator.clipboard.writeText(text).then(function(){
        var m = $('#copy-msg');
        if(!m) return;
        m.textContent = 'คัดลอกแล้ว — เอาไปวางเทียบกับที่เหรัญญิกแจ้งได้เลย';
        m.style.display = 'block';
      }).catch(function(){
        var m = $('#copy-msg');
        if(!m) return;
        m.textContent = 'คัดลอกไม่สำเร็จ (เบราว์เซอร์อาจไม่รองรับ)';
        m.className = 'msg';
        m.style.display = 'block';
      });
    }

    $('#daySelect').addEventListener('change', function(){
      var v = this.value;
      if(!v) renderAllDaysTable(); else renderOneDay(v);
    });

    var url = APPS_SCRIPT_URL + '?mode=report&token=' + encodeURIComponent(token);
    fetch(url).then(function(res){ return res.json(); }).then(function(data){
      if(!data.ok){ showMsg(data.error || 'โหลดรายงานไม่สำเร็จ'); $('#grand').textContent=''; return; }
      report = data;
      renderGrand();
      renderDaySelect();
      renderAllDaysTable();
    }).catch(function(err){
      showMsg('โหลดรายงานไม่สำเร็จ: ' + err.message);
    });
  }
})();
</script>
